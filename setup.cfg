[metadata]
name = dre
version = attr: my_package.VERSION
author = Anguelos Nicolaou
author_email = anguelos.nicolaou@gmail.com  
description = "DRE: A Deep Regex Engine on top of PyTorch supporting soft matching and semantic matching"
long_description = file: README.md, LICENSE.txt
keywords = regex, deep learning, pytorch, nlp
license = GPLv3
classifiers =
    Programming Language :: Python :: 3

[options]
zip_safe = False
include_package_data = True
packages = find:
python_requires = >=3.8
install_requires =
    sly
    tqdm
    torch
    numpy
    graphviz
    nltk

[options.package_data]
* = *.txt, *.rst
hello = *.msg

[options.entry_points]
console_scripts =
    executable-name = my_package.module:function


[options.packages.find]
exclude =
    doc*
    test*
    bin*

[pycodestyle]
#ignore = W503,E501,E203
ignore = E501
max-line-length = 160